name: Check PR Labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches:
      - main

jobs:
  check-version-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for version labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # major, minor, patch, skip-release のいずれかが含まれているか正規表現でチェック
          if echo "$LABELS" | grep -qiE '"(major|minor|patch|skip-release)"'; then
            echo "✅ Valid version label found. You are good to go!"
            exit 0
          else
            echo "❌ Error: You must add a 'major', 'minor', 'patch', or 'skip-release' label to this PR before merging."
            exit 1
          fi
