name: Bump Cargo Version on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine version bump from PR labels
        id: determine-bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # デフォルトの上がり幅（ラベルが無い場合はパッチとする）
          BUMP="patch"

          # ラベルに応じて上がり幅を決定する（major > minor > patch の優先度）
          if echo "$LABELS" | grep -qi '"major"'; then
            BUMP="major"
          elif echo "$LABELS" | grep -qi '"minor"'; then
            BUMP="minor"
          elif echo "$LABELS" | grep -qi '"patch"'; then
            BUMP="patch"
          fi

          echo "Selected bump type: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Compute next version
        id: next-version
        run: |
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ steps.determine-bump.outputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Current version: $CURRENT_VERSION -> New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-edit
        run: cargo binstall --no-confirm cargo-edit

      - name: Bump Cargo.toml and Cargo.lock
        run: cargo set-version ${{ steps.next-version.outputs.version }}

      - name: Create version bump PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-version-${{ steps.next-version.outputs.version }}
          base: main
          commit-message: "chore: bump version to ${{ steps.next-version.outputs.version }}"
          title: "chore: bump version to ${{ steps.next-version.outputs.version }}"
          body: |
            #${{ github.event.pull_request.number }} のマージに伴う自動バージョンアップです。
          labels: skip-release
          add-paths: |
            Cargo.toml
            Cargo.lock
