name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "proto/**"
      - "tests/**"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lmdb:
    name: Verify (LMDB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kasane"
          key: lmdb

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            --locked \
            --lib \
            --bins \
            --tests \
            --features production \
            -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run \
            --locked \
            --lib \
            --bins \
            --tests \
            --features production \
            --run-ignored all

  memory:
    name: Verify (in-memory, Wasm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kasane"
          key: memory

      - name: Clippy
        run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings

      - name: Test
        run: cargo nextest run --locked --lib --no-default-features

      - name: Check Wasm target
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown
