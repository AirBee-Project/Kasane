name: main merge tests

on:
  pull_request:
    branches:
      - main

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "features: none"
            features: ""
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --locked --lib --bins --tests --no-default-features --features "${{ matrix.features }}"
          else
            cargo test --locked --lib --bins --tests --no-default-features
          fi

      - name: Verify OpenAPI spec matches generated
        shell: bash
        run: |
          set -euo pipefail
          # Generate OpenAPI spec
          cargo test generate_openapi_spec --no-fail-fast
          # Compare generated files with committed files
          git diff -- openapi.json openapi.yaml || true
          # Check if there are uncommitted changes
          if git diff --quiet openapi.json openapi.yaml; then
            echo "✓ OpenAPI specs are up to date"
          else
            echo "✗ OpenAPI specs are out of date. Please run 'cargo test' and commit the updated files."
            git diff openapi.json openapi.yaml
            exit 1
          fi

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --locked --lib --bins --tests --no-default-features --features "${{ matrix.features }}" -- -D warnings
          else
            cargo clippy --locked --lib --bins --tests --no-default-features -- -D warnings
          fi
