name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"
      - "openapi.json"
      - "openapi.yaml"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production" \
            -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production" \
            --run-ignored all

      - name: Generate OpenAPI spec
        shell: bash
        run: cargo test generate_openapi_spec --no-fail-fast

      - name: Auto-commit OpenAPI spec if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update openapi spec"
          file_pattern: "openapi.json openapi.yaml"
