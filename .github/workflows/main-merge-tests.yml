name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"
      - "openapi.json"
      - "openapi.yaml"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "features: none"
            features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ matrix.features }}" ]; then
            cargo test \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features \
              --features "${{ matrix.features }}" \
              -- --include-ignored
          else
            cargo test \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features \
              -- --include-ignored
          fi

      - name: Verify OpenAPI spec matches generated
        shell: bash
        run: |
          set -euo pipefail

          # Generate OpenAPI spec
          cargo test generate_openapi_spec --no-fail-fast

          # Show diff if changed
          git diff -- openapi.json openapi.yaml || true

          # Fail if generated specs differ
          if git diff --quiet openapi.json openapi.yaml; then
            echo "✓ OpenAPI specs are up to date"
          else
            echo "✗ OpenAPI specs are out of date."
            echo "Run 'cargo test generate_openapi_spec' and commit the results."
            exit 1
          fi

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features \
              --features "${{ matrix.features }}" \
              -- -D warnings
          else
            cargo clippy \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features \
              -- -D warnings
          fi
