name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production" \
            -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production" \
            --run-ignored all

      - name: Validate OpenAPI spec
        shell: bash
        run: |
          set -euo pipefail

          # Generate OpenAPI spec
          cargo run --bin export_openapi

          # Lint OpenAPI spec
          npx --yes @redocly/cli lint openapi.json
