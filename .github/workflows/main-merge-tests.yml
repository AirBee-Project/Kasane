name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lmdb:
    name: Verify (LMDB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kasane"
          key: lmdb

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production,backend-lmdb" \
            -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production,backend-lmdb" \
            --run-ignored all

      - name: Validate OpenAPI spec
        shell: bash
        run: |
          set -euo pipefail

          # Generate OpenAPI spec
          cargo run --bin export_openapi

          # Lint OpenAPI spec
          npx --yes @redocly/cli lint openapi.json

  tikv:
    name: Verify (TiKV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kasane"
          key: tikv

      - name: Start TiKV
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production,backend-tikv" \
            -- -D warnings

      - name: Wait for the cluster to accept writes
        shell: bash
        run: |
          set -euo pipefail
          # compose の healthcheck は PD だけを見る。TiKV ストアが PD へ登録され、
          # リージョンが用意できるまでは書き込みが通らないので、そこまで待つ。
          for _ in $(seq 1 90); do
            if docker exec kasane-pd /pd-ctl -u http://127.0.0.1:2379 store \
                 | grep -q '"state_name": "Up"'; then
              echo "TiKV store is up"
              exit 0
            fi
            sleep 2
          done

          # 失敗したら「なぜ Up にならなかったか」が分かる材料をすべて出す。
          # ここが空振りすると、次の調査でまた同じ待ち時間を使うことになる。
          echo "::error::TiKV store did not come up in time" >&2
          {
            echo "--- containers ---";      docker compose ps -a
            echo "--- disk ---";            df -h
            echo "--- pd: stores ---";      docker exec kasane-pd /pd-ctl -u http://127.0.0.1:2379 store || true
            echo "--- pd: cluster ---";     docker exec kasane-pd /pd-ctl -u http://127.0.0.1:2379 cluster || true
            echo "--- tikv log (tail) ---"; docker logs --tail 200 kasane-tikv
            echo "--- pd log (tail) ---";   docker logs --tail 100 kasane-pd
          } >&2
          exit 1

      - name: Test
        shell: bash
        env:
          KASANE_TIKV_PD_ENDPOINTS: 127.0.0.1:2379
        run: |
          set -euo pipefail
          cargo nextest run \
            --locked \
            --lib \
            --bins \
            --tests \
            --no-default-features \
            --features "production,backend-tikv" \
            --run-ignored all

      - name: Dump cluster logs on failure
        if: failure()
        shell: bash
        run: docker compose logs

      - name: Stop TiKV
        if: always()
        shell: bash
        run: docker compose down -v
