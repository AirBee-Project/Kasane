# 開発・テスト用の単一ノード TiKV 設定。
#
# **CI が回ればよい大きさに絞ってある。** スレッドプールはすべて 1〜2 で、負荷をかけると
# そこが直列の詰まりになる。手元で書き込み負荷を見るときは大きいほうへ差し替えること:
#
#   KASANE_TIKV_CONFIG=tikv-large.toml docker compose up -d --wait

[server]
grpc-concurrency = 1

[storage]
scheduler-worker-pool-size = 1
reserve-space = "0KB"
reserve-raft-space = "0KB"

[storage.block-cache]
capacity = "256MB"

[raftstore]
store-pool-size = 1
apply-pool-size = 1

[readpool.unified]
min-thread-count = 1
max-thread-count = 2

[readpool.storage]
use-unified-pool = true

[readpool.coprocessor]
use-unified-pool = true

[rocksdb]
max-background-jobs = 2
max-sub-compactions = 1
# TiKV は起動時に `rocksdb + raftdb の max-open-files + 1000` 以上の nofile を要求し、
# 足りなければ FATAL で落ちる。既定 (40960 + 40960 + 1000 = 82920) は GitHub Actions の
# Docker 既定 nofile 65536 を超えるため、要求値のほうを下げておく。
max-open-files = 4096

[raftdb]
max-background-jobs = 2
max-open-files = 4096
