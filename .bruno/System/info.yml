info:
  name: info
  type: http
  seq: 1
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/system/info"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Get system info successfully
    request:
      url: "{{baseUrl}}/system/info"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "version": "0.1.0"
          }
