info:
  name: data_insert
  type: http
  seq: 1
  tags:
    - data

http:
  method: PUT
  url: "{{baseUrl}}/databases/:db_name/tables/:table_name/data"
  params:
    - name: db_name
      value: ""
      type: path
    - name: table_name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "value": "SampleData",
        "spatial_ids": [{"type":"singleId","z":23,"f":0,"x":7451089,"y":3303245}],
        "zoom_level_policy": "Error"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Data inserted
    request:
      url: "{{baseUrl}}/databases/:db_name/tables/:table_name/data"
      method: PUT
      params:
        - name: db_name
          value: ""
          type: path
        - name: table_name
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "value": "SampleData",
            "spatial_ids": [{"type":"singleId","z":23,"f":0,"x":7451089,"y":3303245}],
            "zoom_level_policy": "Error"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Table not found
    request:
