info:
  name: layer_create
  type: http
  seq: 2
  tags:
    - layers

http:
  method: POST
  url: "{{baseUrl}}/layers"
  body:
    type: json
    data: |-
      {
        "name": "example_layer",
        "data_type": "Int",
        "max_zoom_level": 25
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Layer created
    request:
      url: "{{baseUrl}}/layers"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "example_layer",
            "data_type": "Text",
            "max_zoom_level": 25
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/layers"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "example_layer",
            "data_type": "Text",
            "max_zoom_level": 25
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 409 Response
    description: Layer already exists
    request:
      url: "{{baseUrl}}/layers"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "example_layer",
            "data_type": "Text",
            "max_zoom_level": 25
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: text
        data: ""
