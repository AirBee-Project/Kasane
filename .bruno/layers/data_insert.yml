info:
  name: data_insert
  type: http
  seq: 5
  tags:
    - layers

http:
  method: PUT
  url: "{{baseUrl}}/layers/:name/data"
  params:
    - name: name
      value: example_layer
      type: path
      description: Layer name
  body:
    type: json
    data: |-
      {
          "value": 3,
          "query": {
              "ids": [
                  {
                  "z": 20,
                  "f": [0,100],
                  "x": [931380,931386],
                  "y": [412900,412905],
                  "type": "rangeId"
                  }
              ],
              "type": "spatialIds"
              }
          }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

