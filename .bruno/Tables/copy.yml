info:
  name: copy
  type: http
  seq: 6
  tags:
    - tables

http:
  method: POST
  url: "{{baseUrl}}/databases/:db_name/tables/:table_name/copy"
  params:
    - name: db_name
      value: ""
      type: path
    - name: table_name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "copy_db_name": "example_database",
        "copy_table_name": "example_table_copy"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Table copied successfully
    request:
      url: "{{baseUrl}}/databases/:db_name/tables/:table_name/copy"
      method: POST
      params:
        - name: db_name
          value: source_db
          type: path
        - name: table_name
          value: source_table
          type: path
      body:
        type: json
        data: |-
          {
            "copy_db_name": "dest_db",
            "copy_table_name": "dest_table"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "dest_table",
            "data_type": "Int",
            "max_zoom_level": 25,
            "constraints": {
              "type": "Int",
              "min": 0,
              "max": 100
            }
          }
