info:
  name: info
  type: http
  seq: 2
  tags:
    - tables

http:
  method: GET
  url: "{{baseUrl}}/databases/:db_name/tables/:table_name"
  params:
    - name: db_name
      value: ""
      type: path
    - name: table_name
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Table info
    request:
      url: "{{baseUrl}}/databases/:db_name/tables/:table_name"
      method: GET
      params:
        - name: db_name
          value: ""
          type: path
        - name: table_name
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "example_table",
            "data_type": "Text",
            "max_zoom_level": 25,
            "count": 0,
            "is_temporal": true
          }
  - name: 404 Response
    description: Table not found
    request:
      url: "{{baseUrl}}/databases/:db_name/tables/:table_name"
      method: GET
      params:
        - name: db_name
          value: ""
          type: path
        - name: table_name
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
