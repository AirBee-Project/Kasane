info:
  name: update
  type: http
  seq: 4
  tags:
    - databases

http:
  method: PATCH
  url: "{{baseUrl}}/databases/:name"
  params:
    - name: name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "new_name": "example_database_renamed",
        "description": "更新されたデータベースの説明です"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Database renamed successfully
    request:
      url: "{{baseUrl}}/databases/:name"
      method: PATCH
      params:
        - name: name
          value: old_database_name
          type: path
      body:
        type: json
        data: |-
          {
            "new_name": "new_database_name",
            "description": "更新されたデータベースの説明です"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
