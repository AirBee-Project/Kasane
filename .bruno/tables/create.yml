info:
  name: create
  type: http
  seq: 3
  tags:
    - tables

http:
  method: POST
  url: "{{baseUrl}}/databases/:db_name/tables"
  params:
    - name: db_name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "example_table",
        "data_type": "Text",
        "max_zoom_level": 25,
        "description": "テーブルの説明文です"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

