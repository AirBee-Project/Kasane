info:
  name: table_update
  type: http
  seq: 5
  tags:
    - tables

http:
  method: PATCH
  url: "{{baseUrl}}/databases/:db_name/tables/:table_name"
  params:
    - name: db_name
      value: ""
      type: path
    - name: table_name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "example_table_renamed",
        "constraints": {
          "type": "Int",
          "min": 0,
          "max": 100
        },
        "validate_existing_data": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Table updated successfully
    request:
      url: "{{baseUrl}}/databases/:db_name/tables/:table_name"
      method: PATCH
      params:
        - name: db_name
          value: "test_db"
          type: path
        - name: table_name
          value: "example_table"
          type: path
      body:
        type: json
        data: |-
          {
            "name": "example_table_renamed",
            "constraints": {
              "type": "Int",
              "min": 0,
              "max": 100
            },
            "validate_existing_data": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "example_table_renamed",
            "data_type": "Int",
            "max_zoom_level": 25,
            "constraints": {
              "type": "Int",
              "min": 0,
              "max": 100
            }
          }
