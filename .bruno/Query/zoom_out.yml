info:
  name: zoom_out
  type: http
  seq: 3
  tags:
    - query

http:
  method: POST
  url: "{{baseUrl}}/query"
  params:
    - name: format
      value: rangeId
      type: query
    - name: limit
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "spatial_ids": [
          { "type": "rangeId", "z": 20, "f": [0, 0], "x": [931386, 931389], "y": [412905, 412908] }
        ],
        "query": {
          "type": "zoomOut",
          "z": 20,
          "policy": "average",
          "input": {
            "type": "source",
            "database": "example_database",
            "table": "example_table"
          }
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: >-
      指定の値までズームレベルを落とし、重なった値を policy で集約する。
      policy は overwrite / keepExisting / max / min（全型）と
      sum / difference / average（Int のみ）。
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "rangeId", "z": 20, "f": [0, 0], "x": [931386, 931389], "y": [412905, 412908] }
            ],
            "query": {
              "type": "zoomOut",
              "z": 20,
              "policy": "average",
              "input": {
                "type": "source",
                "database": "example_database",
                "table": "example_table"
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "dictionary": [45],
            "data": [
              {
                "valueRef": 0,
                "spatialIds": [
                  { "z": 20, "f": [0, 0], "x": [931386, 931386], "y": [412905, 412905] }
                ]
              }
            ]
          }
  - name: 400 Response
    description: 数値専用の policy を非数値型のテーブルに使った
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "singleId", "z": 20, "f": 0, "x": 931386, "y": 412905 }
            ],
            "query": {
              "type": "zoomOut",
              "z": 20,
              "policy": "sum",
              "input": {
                "type": "source",
                "database": "example_database",
                "table": "text_table"
              }
            }
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
