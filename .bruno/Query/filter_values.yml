info:
  name: filter_values
  type: http
  seq: 2
  tags:
    - query

http:
  method: POST
  url: "{{baseUrl}}/query"
  params:
    - name: format
      value: rangeId
      type: query
    - name: limit
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "spatial_ids": [
          { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
        ],
        "query": {
          "type": "filterValues",
          "mode": "inRange",
          "min": 5,
          "max": 100,
          "input": {
            "type": "source",
            "database": "example_database",
            "table": "example_table"
          }
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: >-
      値の条件でセルを絞り込む（空間的な形は変えない）。mode は equals / inRange /
      notInRange の3種。inRange と notInRange の min max はどちらも省略可（片側だけの範囲になる）。
      比較に使うのは順序だけなので文字列・真偽値にも使える。この例は 5〜100 の値だけを残す
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
            ],
            "query": {
              "type": "filterValues",
              "mode": "inRange",
              "min": 5,
              "max": 100,
              "input": {
                "type": "source",
                "database": "example_database",
                "table": "example_table"
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "dictionary": [10],
            "data": [
              {
                "valueRef": 0,
                "spatialIds": [
                  { "z": 23, "f": [0, 0], "x": [7451089, 7451089], "y": [3303245, 3303245] }
                ]
              }
            ]
          }
  - name: 400 Response
    description: 範囲の下限が上限を上回っている
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "singleId", "z": 23, "f": 0, "x": 7451089, "y": 3303245 }
            ],
            "query": {
              "type": "filterValues",
              "mode": "inRange",
              "min": 100,
              "max": 5,
              "input": {
                "type": "source",
                "database": "example_database",
                "table": "example_table"
              }
            }
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
