info:
  name: shift_extrude
  type: http
  seq: 5
  tags:
    - query

http:
  method: POST
  url: "{{baseUrl}}/query"
  params:
    - name: format
      value: flexId
      type: query
    - name: limit
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "spatial_ids": [
          { "type": "rangeId", "z": 25, "f": [0, 50], "x": [29804360, 29804368], "y": [13212980, 13212988] }
        ],
        "query": {
          "type": "extrudeF",
          "z": 25,
          "start": 0,
          "end": 50,
          "policy": "max",
          "input": {
            "type": "shiftX",
            "z": 25,
            "index": 2,
            "input": {
              "type": "source",
              "database": "example_database",
              "table": "example_table"
            }
          }
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: >-
      shiftX / shiftY / shiftF は指定ズームレベル z の 1 セル分を単位に index だけ平行移動する。
      extrudeX / extrudeY / extrudeF は各セルをその軸の絶対座標範囲 start..=end へ引き延ばす。
      いずれも z より粗いセルは z の粒度まで細分されるため、結果はテーブルの
      max_zoom_level より細かくなりうる。要求する spatial_ids はその解像度で指定してよい
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "rangeId", "z": 25, "f": [0, 50], "x": [29804360, 29804368], "y": [13212980, 13212988] }
            ],
            "query": {
              "type": "extrudeF",
              "z": 25,
              "start": 0,
              "end": 50,
              "policy": "max",
              "input": {
                "type": "shiftX",
                "z": 25,
                "index": 2,
                "input": {
                  "type": "source",
                  "database": "example_database",
                  "table": "example_table"
                }
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "dictionary": [10],
            "data": [
              {
                "valueRef": 0,
                "spatialIds": [
                  {
                    "fZoomlevel": 25,
                    "fIndex": 0,
                    "xZoomlevel": 25,
                    "xIndex": 29804362,
                    "yZoomlevel": 25,
                    "yIndex": 13212980
                  }
                ]
              }
            ]
          }
  - name: 400 Response
    description: 座標がそのズームレベルの範囲外（z=5 の X 上限は 31）
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "singleId", "z": 5, "f": 0, "x": 10, "y": 10 }
            ],
            "query": {
              "type": "extrudeX",
              "z": 5,
              "start": 0,
              "end": 9999,
              "policy": "max",
              "input": {
                "type": "source",
                "database": "example_database",
                "table": "example_table"
              }
            }
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
