info:
  name: source_only
  type: http
  seq: 1
  tags:
    - query

http:
  method: POST
  url: "{{baseUrl}}/query"
  params:
    - name: format
      value: rangeId
      type: query
    - name: limit
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "spatial_ids": [
          { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
        ],
        "query": {
          "type": "source",
          "database": "example_database",
          "table": "example_table"
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: 演算子なしの素通し。指定領域の格納値をそのまま返す
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
            ],
            "query": {
              "type": "source",
              "database": "example_database",
              "table": "example_table"
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "dictionary": [10],
            "data": [
              {
                "valueRef": 0,
                "spatialIds": [
                  { "z": 23, "f": [0, 0], "x": [7451089, 7451089], "y": [3303245, 3303245] }
                ]
              }
            ]
          }
  - name: 404 Response
    description: 参照先のテーブルが存在しない
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "singleId", "z": 23, "f": 0, "x": 7451089, "y": 3303245 }
            ],
            "query": {
              "type": "source",
              "database": "missing_database",
              "table": "missing_table"
            }
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
