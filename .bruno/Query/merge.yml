info:
  name: merge
  type: http
  seq: 4
  tags:
    - query

http:
  method: POST
  url: "{{baseUrl}}/query"
  params:
    - name: format
      value: rangeId
      type: query
    - name: limit
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "spatial_ids": [
          { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
        ],
        "query": {
          "type": "merge",
          "policy": "sum",
          "default": 0,
          "left": {
            "type": "source",
            "database": "example_database",
            "table": "table_a"
          },
          "right": {
            "type": "source",
            "database": "example_database",
            "table": "table_b"
          }
        }
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: >-
      2つの部分式を policy で重ね合わせる。片側にしか値が無いセルは default を
      相手側の値とみなす（両側とも空のセルは空のまま）。参照する全データベースに
      Read 権限が必要。全ソースの data_type が一致していない場合は value_type の明示が要る
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "rangeId", "z": 23, "f": [0, 0], "x": [7451089, 7451092], "y": [3303245, 3303248] }
            ],
            "query": {
              "type": "merge",
              "policy": "sum",
              "default": 0,
              "left": {
                "type": "source",
                "database": "example_database",
                "table": "table_a"
              },
              "right": {
                "type": "source",
                "database": "example_database",
                "table": "table_b"
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "dictionary": [10],
            "data": [
              {
                "valueRef": 0,
                "spatialIds": [
                  { "z": 23, "f": [0, 0], "x": [7451089, 7451089], "y": [3303245, 3303245] }
                ]
              }
            ]
          }
  - name: 403 Response
    description: 参照先データベースへの Read 権限が不足している
    request:
      url: "{{baseUrl}}/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "spatial_ids": [
              { "type": "singleId", "z": 23, "f": 0, "x": 7451089, "y": 3303245 }
            ],
            "query": {
              "type": "merge",
              "policy": "sum",
              "default": 0,
              "left": {
                "type": "source",
                "database": "example_database",
                "table": "table_a"
              },
              "right": {
                "type": "source",
                "database": "other_database",
                "table": "table_b"
              }
            }
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
