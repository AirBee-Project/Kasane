info:
  name: update_password
  type: http
  seq: 4
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/users/:username/password"
  params:
    - name: username
      value: ""
      type: path
      description: Username
  body:
    type: json
    data: |-
      {
        "password": "newsecret123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Password updated successfully
    request:
      url: "{{baseUrl}}/users/:username/password"
      method: PUT
      params:
        - name: username
          value: ""
          type: path
          description: Username
      body:
        type: json
        data: |-
          {
            "password": "newsecret123"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: User not found
    request:
      url: "{{baseUrl}}/users/:username/password"
      method: PUT
      params:
        - name: username
          value: ""
          type: path
          description: Username
      body:
        type: json
        data: |-
          {
            "password": "newsecret123"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
