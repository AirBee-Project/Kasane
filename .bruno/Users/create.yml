info:
  name: create
  type: http
  seq: 3
  tags:
    - Users

docs: |-
  ユーザーを作成する。privileges を指定すると作成と同時に権限を付与できる。

  必要な権限: global / admin

  privileges の各要素は scope で判別する:
    { "scope": "global", "role": "admin" }
    { "scope": "database", "db_name": "...", "role": "manage" }
    { "scope": "table", "db_name": "...", "table_name": "...", "role": "read" }

  database / table スコープに admin は指定できない。
  存在しないデータベース・テーブルを指すルールは 404 で拒否される。

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "username": "alice",
        "password": "secret123",
        "privileges": []
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: User created successfully
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "alice",
            "password": "secret123",
            "privileges": []
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
  - name: 409 Response
    description: User already exists
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "alice",
            "password": "secret123",
            "privileges": []
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: text
        data: ""
