info:
  name: set_database
  type: http
  seq: 4
  tags:
    - Users

docs: |-
  データベース 1 つに対する権限を設定する（無ければ追加、あれば置き換え）。
  配下のテーブルすべてに効く。

  必要な権限: global / admin

  role は read / write / manage。admin はこのスコープでは指定できない（422）。

  権限はデータベース ID に紐づくため、データベースを改名しても追従する。

http:
  method: PUT
  url: "{{baseUrl}}/users/:username/privileges/databases/:db_name"
  params:
    - name: username
      value: ""
      type: path
      description: Username
    - name: db_name
      value: ""
      type: path
      description: Database name
  body:
    type: json
    data: |-
      {
        "role": "read"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Privilege set successfully
    request:
      url: "{{baseUrl}}/users/:username/privileges/databases/:db_name"
      method: PUT
      params:
        - name: username
          value: alice
          type: path
          description: Username
        - name: db_name
          value: example_database
          type: path
          description: Database name
      body:
        type: json
        data: |-
          {
            "role": "manage"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: User or database not found
    request:
      url: "{{baseUrl}}/users/:username/privileges/databases/:db_name"
      method: PUT
      params:
        - name: username
          value: alice
          type: path
          description: Username
        - name: db_name
          value: unknown_database
          type: path
          description: Database name
      body:
        type: json
        data: |-
          {
            "role": "read"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Database 'unknown_database' not found",
            "code": "database_not_found"
          }
  - name: 422 Response
    description: admin cannot be granted at this scope
    request:
      url: "{{baseUrl}}/users/:username/privileges/databases/:db_name"
      method: PUT
      params:
        - name: username
          value: alice
          type: path
          description: Username
        - name: db_name
          value: example_database
          type: path
          description: Database name
      body:
        type: json
        data: |-
          {
            "role": "admin"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""
