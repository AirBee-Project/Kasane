info:
  name: get
  type: http
  seq: 1
  tags:
    - Users

docs: |-
  ユーザーが持つ権限ルールの一覧を取得する。

  必要な権限: 本人 または global / admin

  既に削除されたデータベース・テーブルを指すルールは名前へ解決できないため一覧に現れない。
  そうしたルールは認可判定でも一致しないので、表示と実効権限が食い違うことはない。

http:
  method: GET
  url: "{{baseUrl}}/users/:username/privileges"
  params:
    - name: username
      value: ""
      type: path
      description: Username
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Get privileges successfully
    request:
      url: "{{baseUrl}}/users/:username/privileges"
      method: GET
      params:
        - name: username
          value: alice
          type: path
          description: Username
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "privileges": [
              {
                "scope": "global",
                "role": "read"
              },
              {
                "scope": "database",
                "db_name": "example_database",
                "role": "manage"
              },
              {
                "scope": "table",
                "db_name": "example_database",
                "table_name": "example_table",
                "role": "write"
              }
            ]
          }
  - name: 404 Response
    description: User not found
    request:
      url: "{{baseUrl}}/users/:username/privileges"
      method: GET
      params:
        - name: username
          value: unknown
          type: path
          description: Username
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
