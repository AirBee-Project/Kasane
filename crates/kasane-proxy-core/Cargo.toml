[package]
name = "kasane-proxy-core"
version = "0.1.0"
edition = "2024"
description = "Platform-independent proxy core for Kasane"

[dependencies]
kasane-proto = { path = "../kasane-proto" }
prost = "0.14"
futures = "0.3"
async-stream = "0.3"
http = "1.2"
bytes = "1.10"
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt"] }
