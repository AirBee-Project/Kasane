openapi: 3.1.0
info:
  title: kasane
  description: ''
  license:
    name: ''
  version: 0.3.2
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: ユーザーログインとJWTの発行
      description: ユーザー名とパスワードを検証し、Bearerトークンを発行します。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 認証失敗（ユーザー名またはパスワードが不正）
  /databases:
    get:
      tags:
      - Databases
      summary: データベース一覧の取得
      description: |-
        ユーザー権限に応じて、アクセス可能なデータベースの一覧を取得します。

        - **グローバル管理者**: システム内の全データベースが見えます。
        - **一般ユーザー**: 自分が権限を持っているデータベースだけが見えます。
      operationId: database_list
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseInfoResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - Databases
      summary: データベースの作成
      description: 新しいデータベースを作成します。この操作はGlobal Admin権限が必要です。
      operationId: database_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInfoResponse'
      security:
      - bearer_auth:
        - global_admin
  /databases/{db_name}/tables:
    get:
      tags:
      - Tables
      summary: テーブル一覧の取得
      description: 指定したデータベース内に存在するテーブルの一覧を取得します。この操作はデータベースのRead以上の権限が必要です。
      operationId: table_list
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - Tables
      summary: テーブルの作成
      description: 指定したデータベース内に新しいテーブルを作成します。この操作はデータベースのManage以上の権限が必要です。
      operationId: table_create
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
        required: true
      responses:
        '201':
          description: ''
        '400':
          description: リクエストが不正（パラメータエラーなど）
        '409':
          description: 同名のテーブルが既に存在する
      security:
      - bearer_auth: []
  /databases/{db_name}/tables/{table_name}:
    get:
      tags:
      - Tables
      summary: テーブル情報の取得
      description: 指定したテーブルの詳細情報を取得します。この操作はデータベースのRead以上の権限が必要です。
      operationId: table_info
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableInfoResponse'
        '404':
          description: テーブルまたはデータベースが存在しない
      security:
      - bearer_auth: []
    delete:
      tags:
      - Tables
      summary: テーブルの削除
      description: 指定したテーブルを削除します。この操作はデータベースのManage以上の権限が必要です。
      operationId: remove_table
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      responses:
        '204':
          description: ''
        '404':
          description: テーブルが存在しない
      security:
      - bearer_auth: []
    patch:
      tags:
      - Tables
      summary: テーブルの更新
      description: |-
        テーブルの名前変更や値の制約を更新します。この操作はデータベースの Manage 権限が必要です。

        制約を変更する際、既存のデータが新しい制約に適合しているかを検証する挙動を `validate_existing_data` フラグで制御できます。
        - `true`（デフォルト）の場合、既存データが新しい制約に違反していればエラーとして更新を却下します。
        - `false` の場合、既存データのチェックをスキップして高速に変更を適用します（不整合なデータが残る可能性があります）。
      operationId: table_update_handler
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
        required: true
      responses:
        '200':
          description: テーブルの更新に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSummary'
        '400':
          description: リクエストが不正（パラメータエラー、または validate_existing_data=true の状態で既存データが新しい制約に違反した場合）
        '401':
          description: 認証エラー
        '403':
          description: 権限が不足している
        '404':
          description: データベースまたはテーブルが見つからない
        '409':
          description: 同名のテーブルが既に存在する
      security:
      - bearer_auth: []
  /databases/{db_name}/tables/{table_name}/copy:
    post:
      tags:
      - Tables
      summary: テーブルのコピー
      description: |-
        指定したテーブルを別のデータベース、または同じデータベース内に異なる名前でコピーします。
        コピー元データベースに対するRead権限と、コピー先データベースに対するManage権限が必要です。
      operationId: table_copy
      parameters:
      - name: db_name
        in: path
        description: コピー元データベース名
        required: true
        schema:
          type: string
        example: source_database
      - name: table_name
        in: path
        description: コピー元テーブル名
        required: true
        schema:
          type: string
        example: source_table
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTableRequest'
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSummary'
        '400':
          description: リクエストが不正（パラメータエラー、または不正なテーブル名）
        '403':
          description: 権限不足（コピー元DBのRead権限、またはコピー先DBのManage権限がない場合）
        '404':
          description: コピー元データベース、コピー元テーブル、またはコピー先データベースが存在しない
        '409':
          description: コピー先テーブルがすでに存在する
      security:
      - bearer_auth: []
  /databases/{db_name}/tables/{table_name}/data:
    put:
      tags:
      - Data
      summary: データの上書き・追加
      description: |-
        指定した空間IDに対して、指定した値を書き込みます。
        既に値が存在する空間IDに対しては、その値を完全に上書きします。

        この操作はデータベースのWrite以上の権限が必要です。
      operationId: data_insert
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertDataRequest'
        required: true
      responses:
        '200':
          description: ''
        '404':
          description: テーブルが存在しない
      security:
      - bearer_auth: []
    delete:
      tags:
      - Data
      summary: データの削除
      description: 指定した空間IDをテーブルからを削除します。この操作はデータベースのWrite以上の権限が必要です。
      operationId: data_remove
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDataRequest'
        required: true
      responses:
        '204':
          description: ''
        '404':
          description: テーブルが存在しない
      security:
      - bearer_auth: []
    patch:
      tags:
      - Data
      summary: データの部分追加
      description: |-
        指定した空間IDに対して、指定した値を書き込みます。

        - **指定した空間IDがすでに存在する場合**: 既存のデータは維持されます。
        - **指定した空間IDが存在しない場合**: データが書き込まれます。

        この操作はデータベースのWrite以上の権限が必要です。
      operationId: data_upsert
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertDataRequest'
        required: true
      responses:
        '204':
          description: ''
        '404':
          description: テーブルが存在しない
      security:
      - bearer_auth: []
  /databases/{db_name}/tables/{table_name}/data/search:
    post:
      tags:
      - Data
      summary: データの一括取得
      description: 空間IDと値をJSON配列として一括で取得します。この操作はデータベースのRead以上の権限が必要です。
      operationId: data_get
      parameters:
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      - name: table_name
        in: path
        description: テーブル名
        required: true
        schema:
          type: string
        example: example_table
      - name: format
        in: query
        description: 出力フォーマット(singleId, rangeId, flexId)
        required: false
        schema:
          $ref: '#/components/schemas/OutputFormat'
      - name: limit
        in: query
        description: 最大取得件数
        required: false
        schema:
          type: integer
          minimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDataRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDataResponse'
        '404':
          description: テーブルが存在しない
      security:
      - bearer_auth: []
  /databases/{name}:
    get:
      tags:
      - Databases
      summary: データベース情報の取得
      description: 指定したデータベースの詳細情報を取得します。対象データベースのRead以上の権限が必要です。
      operationId: database_info
      parameters:
      - name: name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInfoResponse'
      security:
      - bearer_auth: []
    delete:
      tags:
      - Databases
      summary: データベースの削除
      description: 指定したデータベースを削除します。この操作はGlobal Admin権限が必要です。
      operationId: remove_database
      parameters:
      - name: name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      responses:
        '204':
          description: ''
      security:
      - bearer_auth:
        - global_admin
    patch:
      tags:
      - Databases
      summary: データベースの更新
      description: 指定したデータベースの名前や説明を変更します。対象データベースのManage以上の権限が必要です。
      operationId: database_update
      parameters:
      - name: name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseRequest'
        required: true
      responses:
        '200':
          description: 成功
        '400':
          description: リクエストが不正（パラメータエラー、または新しいデータベース名が不正）
        '403':
          description: 権限不足（Manage権限がない場合）
        '404':
          description: 変更元のデータベースが存在しない
        '409':
          description: 変更後のデータベース名がすでに存在する
      security:
      - bearer_auth: []
  /databases/{name}/copy:
    post:
      tags:
      - Databases
      summary: データベースのコピー
      description: 指定したデータベースをコピーします。この操作はGlobal Admin権限が必要です。
      operationId: database_copy
      parameters:
      - name: name
        in: path
        description: コピー元データベース名
        required: true
        schema:
          type: string
        example: source_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDatabaseRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInfoResponse'
        '400':
          description: リクエストが不正（パラメータエラー、または不正なデータベース名）
        '403':
          description: 権限不足（Global Admin権限がない場合）
        '404':
          description: コピー元データベースが存在しない
        '409':
          description: コピー先データベース、またはコピー元と同名のデータベースがすでに存在する
      security:
      - bearer_auth:
        - global_admin
  /query:
    post:
      tags:
      - Query
      summary: クエリの実行
      description: |-
        複数のテーブルを対象にクエリ式を実行し、指定した空間IDの結果を取得します。
        クエリ式が参照する**すべてのデータベース**に対して Read 以上の権限が必要です。
      operationId: execute_query
      parameters:
      - name: format
        in: query
        description: 出力フォーマット(singleId, rangeId, flexId)
        required: false
        schema:
          $ref: '#/components/schemas/OutputFormat'
      - name: limit
        in: query
        description: 最大取得件数
        required: false
        schema:
          type: integer
          minimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteQueryRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDataResponse'
        '400':
          description: クエリ式が不正（型の混在・非対応の型など）
        '403':
          description: 参照先データベースへの権限が不足
        '404':
          description: 参照先のテーブルが存在しない
      security:
      - bearer_auth: []
  /system/info:
    get:
      tags:
      - System
      summary: サーバーのステータスとバージョン情報を取得する。
      description: ログイン済みのユーザーであれば誰でもアクセス可能です。
      operationId: get_system_info
      responses:
        '200':
          description: Status and version retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
      security:
      - bearer_auth: []
  /users:
    get:
      tags:
      - Users
      summary: ユーザー一覧の取得
      description: ユーザーの一覧を取得します。この操作はGlobal Adminのみ実行可能です。
      operationId: list_users
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfoResponse'
      security:
      - bearer_auth:
        - global_admin
    post:
      tags:
      - Users
      summary: 新規ユーザー作成
      description: 新しいユーザーを作成し、パスワードやGlobal Adminを設定します。この操作はGlobal Adminのみ実行可能です。
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: ''
        '409':
          description: 同名のユーザーが既に存在する
      security:
      - bearer_auth:
        - global_admin
  /users/{username}:
    get:
      tags:
      - Users
      summary: ユーザーの個別取得
      description: 指定したユーザーの基本情報を取得します。Global Adminまたはユーザー本人のみ実行可能です。
      operationId: get_user
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '403':
          description: 権限がない（他人の情報を取得しようとした）
        '404':
          description: ユーザーが存在しない
      security:
      - bearer_auth: []
    delete:
      tags:
      - Users
      summary: ユーザーの削除
      description: 指定したユーザーを削除します。この操作はGlobal Adminのみ実行可能です。
      operationId: delete_user
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      responses:
        '204':
          description: ''
        '404':
          description: ユーザーが存在しない
      security:
      - bearer_auth:
        - global_admin
  /users/{username}/admin:
    put:
      tags:
      - Users
      summary: Global Admin権限の変更
      description: 指定したユーザーのGlobal Admin権限を付与または剥奪します。この操作はGlobal Adminのみ実行可能です。
      operationId: set_admin
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminRequest'
        required: true
      responses:
        '204':
          description: ''
        '403':
          description: rootユーザーの権限は変更不可
        '404':
          description: ユーザーが存在しない
      security:
      - bearer_auth:
        - global_admin
  /users/{username}/password:
    put:
      tags:
      - Users
      summary: パスワードの更新
      description: 指定したユーザーのパスワードを更新します。ユーザー本人が自分自身のパスワードを変更するか、Global Adminが他人のパスワードをリセットする場合に利用可能です。
      operationId: update_password
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
        required: true
      responses:
        '204':
          description: ''
        '404':
          description: ユーザーが存在しない
      security:
      - bearer_auth: []
  /users/{username}/privileges:
    get:
      tags:
      - Users
      summary: データベース権限の取得
      description: 指定したユーザーが持つデータベースごとのアクセス権限（Read, Write, Manage）の一覧を取得します。この操作はグローバル管理者のみ実行可能です。
      operationId: get_privileges
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivilegeInfoResponse'
        '404':
          description: ユーザーが存在しない
      security:
      - bearer_auth:
        - global_admin
  /users/{username}/privileges/{db_name}:
    put:
      tags:
      - Users
      summary: データベース権限の設定
      description: 指定したユーザーに対し、特定のデータベースへのアクセス権限（Read, Write, Manage）を設定します。この操作はグローバル管理者のみ実行可能です。
      operationId: set_privilege
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivilegeRequest'
        required: true
      responses:
        '204':
          description: ''
        '404':
          description: ユーザーまたはデータベースが存在しない
      security:
      - bearer_auth:
        - global_admin
    delete:
      tags:
      - Users
      summary: データベース権限の削除
      description: 指定したユーザーから、特定のデータベースへのアクセス権限を削除します。この操作はグローバル管理者のみ実行可能です。
      operationId: delete_privilege
      parameters:
      - name: username
        in: path
        description: ユーザー名
        required: true
        schema:
          type: string
        example: example_user
      - name: db_name
        in: path
        description: データベース名
        required: true
        schema:
          type: string
        example: example_database
      responses:
        '204':
          description: ''
        '404':
          description: ユーザーまたはデータベースが存在しない
      security:
      - bearer_auth:
        - global_admin
components:
  schemas:
    CopyDatabaseRequest:
      type: object
      required:
      - copy_name
      properties:
        copy_name:
          type: string
          example: example_database_copy
    CopyTableRequest:
      type: object
      description: テーブルのコピーを行う
      required:
      - copy_table_name
      properties:
        copy_db_name:
          type:
          - string
          - 'null'
          example: example_database
        copy_table_name:
          type: string
          example: example_table_copy
    CreateDatabaseRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: example_database
        description:
          type:
          - string
          - 'null'
          example: データベースの説明文
    CreateTableRequest:
      type: object
      description: 時空間IDと値が対応するTableを作成する
      required:
      - name
      - data_type
      - max_zoom_level
      properties:
        name:
          type: string
          example: example_table
        data_type:
          $ref: '#/components/schemas/TableDataType'
        max_zoom_level:
          type: integer
          format: int32
          example: 25
          maximum: 30
          minimum: 0
        constraints:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TableConstraints'
            description: 値に対する制約。指定しない場合は制約なしとなる。
        description:
          type:
          - string
          - 'null'
          example: テーブルの説明です
    CreateUserRequest:
      type: object
      required:
      - username
      - password
      - is_global_admin
      properties:
        username:
          type: string
          example: example_user
        password:
          type: string
          example: secret123
        is_global_admin:
          type: boolean
          example: false
    DataGroup_FlexId:
      type: object
      required:
      - valueRef
      - spatialIds
      properties:
        valueRef:
          type: integer
          minimum: 0
        spatialIds:
          type: array
          items:
            type: object
            description: |-
              高さ・経度・緯度・時間の4軸すべてを「ズームレベル + インデックス」で表す拡張時空間IDを表す型。
              時間を指定する場合は `t_zoomlevel` と `t_index` を必ず両方指定すること。
              両方省略した場合は「全時間」を表す。
            required:
            - fZoomlevel
            - fIndex
            - xZoomlevel
            - xIndex
            - yZoomlevel
            - yIndex
            properties:
              fZoomlevel:
                type: integer
                format: int32
                description: 高さ方向のズームレベル。
                example: 20
                maximum: 30
                minimum: 0
              fIndex:
                type: integer
                format: int32
                description: 高さ方向のインデックス。
                example: 0
              xZoomlevel:
                type: integer
                format: int32
                description: 経度方向のズームレベル。
                example: 20
                maximum: 30
                minimum: 0
              xIndex:
                type: integer
                format: int32
                description: 経度方向のインデックス。
                example: 931386
                minimum: 0
              yZoomlevel:
                type: integer
                format: int32
                description: 緯度方向のズームレベル。
                example: 20
                maximum: 30
                minimum: 0
              yIndex:
                type: integer
                format: int32
                description: 緯度方向のインデックス。
                example: 412905
                minimum: 0
              tZoomlevel:
                type:
                - integer
                - 'null'
                format: int32
                description: 時間軸のズームレベル
                example: 25
                maximum: 35
                minimum: 0
              tIndex:
                type:
                - integer
                - 'null'
                format: int64
                description: 時間軸のインデックス。
                example: 7
                minimum: 0
    DataGroup_RangeId:
      type: object
      required:
      - valueRef
      - spatialIds
      properties:
        valueRef:
          type: integer
          minimum: 0
        spatialIds:
          type: array
          items:
            type: object
            description: |-
              区間表現の時空間IDを表す型。

              時間を指定する場合は `i` と `t` を必ず両方指定すること。
              両方省略した場合は「全時間」を表す。
            required:
            - z
            - f
            - x
            - y
            properties:
              z:
                type: integer
                format: int32
                description: ズームレベル。
                example: 20
                maximum: 30
                minimum: 0
              f:
                type: array
                items:
                  type: integer
                  format: int32
                description: 高さ方向の範囲 `[min, max]`（両端を含む）。
                example:
                - 0
                - 0
              x:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
                description: 経度方向の範囲 `[min, max]`（両端を含む）。
                example:
                - 931388
                - 931390
              y:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
                description: 緯度方向の範囲 `[min, max]`（両端を含む）。
                example:
                - 412900
                - 412907
              i:
                type:
                - integer
                - 'null'
                format: int64
                description: '時間間隔（単位: 秒）。1970-01-01T00:00:00Z を起点とする。任意の値は指定できず、 次の暦の単位のいずれかのみ指定できる: `1`、`60`、`3600`、`86400`、`34359738368`（システムの全時間）。'
                example: 3600
                maximum: 34359738368
                minimum: 1
              t:
                type:
                - array
                - 'null'
                items:
                  type: integer
                  format: int64
                  minimum: 0
                description: 時間インデックスの区間表現。
                example:
                - 0
                - 5
    DataGroup_SingleId:
      type: object
      required:
      - valueRef
      - spatialIds
      properties:
        valueRef:
          type: integer
          minimum: 0
        spatialIds:
          type: array
          items:
            type: object
            description: |-
              通常の時空間IDを表す型。

              時間を指定する場合は `i` と `t` を必ず両方指定すること。
              両方省略した場合は「全時間」を表す。
            required:
            - z
            - f
            - x
            - y
            properties:
              z:
                type: integer
                format: int32
                description: ズームレベル。
                example: 20
                maximum: 30
                minimum: 0
              f:
                type: integer
                format: int32
                description: 高さ方向のインデックス。
                example: 0
              x:
                type: integer
                format: int32
                description: 経度方向のインデックス。
                example: 931386
                minimum: 0
              y:
                type: integer
                format: int32
                description: 緯度方向のインデックス。
                example: 412905
                minimum: 0
              i:
                type:
                - integer
                - 'null'
                format: int64
                description: '時間間隔（単位: 秒）。1970-01-01T00:00:00Z を起点とする。任意の値は指定できず、 次の暦の単位のいずれかのみ指定できる: `1`、`60`、`3600`、`86400`、`34359738368`（システムの全時間）。'
                example: 3600
                maximum: 34359738368
                minimum: 1
              t:
                type:
                - integer
                - 'null'
                format: int64
                description: 時間インデックス。
                example: 1
                minimum: 0
    DatabaseInfoResponse:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: example_database
        description:
          type:
          - string
          - 'null'
          example: データベースの説明文
    ExecuteQueryRequest:
      type: object
      description: Tableに対するQueryを表現する型
      required:
      - spatial_ids
      - query
      properties:
        value_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TableDataType'
        spatial_ids:
          type: array
          items:
            $ref: '#/components/schemas/SpatialId'
        query:
          $ref: '#/components/schemas/QueryNode'
      example:
        query:
          input:
            input:
              input:
                database: sensors
                table: heat_sources
                type: source
              policy: max
              radius: 3
              type: falloffLinearX
              z: 25
            policy: max
            radius: 3
            type: falloffLinearY
            z: 25
          policy: average
          type: zoomOut
          z: 23
        spatial_ids:
        - f:
          - 0
          - 0
          type: rangeId
          x:
          - 7300000
          - 7300063
          y:
          - 3276800
          - 3276863
          z: 23
        value_type: Int
    FilterCondition:
      oneOf:
      - type: object
        description: '`value` に一致する値だけを残す'
        required:
        - value
        - mode
        properties:
          value: {}
          mode:
            type: string
            enum:
            - equals
      - type: object
        description: 値が `min..=max`に入る値だけを残す
        required:
        - mode
        properties:
          min: {}
          max: {}
          mode:
            type: string
            enum:
            - inRange
      - type: object
        description: 値が `min..=max`に入る値を取り除く
        required:
        - mode
        properties:
          min: {}
          max: {}
          mode:
            type: string
            enum:
            - notInRange
      description: 値フィルタの条件。
    FlexId:
      type: object
      description: |-
        高さ・経度・緯度・時間の4軸すべてを「ズームレベル + インデックス」で表す拡張時空間IDを表す型。
        時間を指定する場合は `t_zoomlevel` と `t_index` を必ず両方指定すること。
        両方省略した場合は「全時間」を表す。
      required:
      - fZoomlevel
      - fIndex
      - xZoomlevel
      - xIndex
      - yZoomlevel
      - yIndex
      properties:
        fZoomlevel:
          type: integer
          format: int32
          description: 高さ方向のズームレベル。
          example: 20
          maximum: 30
          minimum: 0
        fIndex:
          type: integer
          format: int32
          description: 高さ方向のインデックス。
          example: 0
        xZoomlevel:
          type: integer
          format: int32
          description: 経度方向のズームレベル。
          example: 20
          maximum: 30
          minimum: 0
        xIndex:
          type: integer
          format: int32
          description: 経度方向のインデックス。
          example: 931386
          minimum: 0
        yZoomlevel:
          type: integer
          format: int32
          description: 緯度方向のズームレベル。
          example: 20
          maximum: 30
          minimum: 0
        yIndex:
          type: integer
          format: int32
          description: 緯度方向のインデックス。
          example: 412905
          minimum: 0
        tZoomlevel:
          type:
          - integer
          - 'null'
          format: int32
          description: 時間軸のズームレベル
          example: 25
          maximum: 35
          minimum: 0
        tIndex:
          type:
          - integer
          - 'null'
          format: int64
          description: 時間軸のインデックス。
          example: 7
          minimum: 0
    GetDataQuery:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/OutputFormat'
        limit:
          type:
          - integer
          - 'null'
          minimum: 0
    GetDataRequest:
      type: object
      description: 空間IDの配列を指定して値を取得する
      required:
      - spatial_ids
      properties:
        spatial_ids:
          type: array
          items:
            $ref: '#/components/schemas/SpatialId'
        zoom_level_policy:
          $ref: '#/components/schemas/ZoomLevelPolicy'
    GetDataResponse:
      oneOf:
      - $ref: '#/components/schemas/GetDataResponseSingle'
      - $ref: '#/components/schemas/GetDataResponseRange'
      - $ref: '#/components/schemas/GetDataResponseFlex'
    GetDataResponseFlex:
      type: object
      required:
      - dictionary
      - data
      properties:
        dictionary:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataGroup_FlexId'
    GetDataResponseRange:
      type: object
      required:
      - dictionary
      - data
      properties:
        dictionary:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataGroup_RangeId'
    GetDataResponseSingle:
      type: object
      required:
      - dictionary
      - data
      properties:
        dictionary:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataGroup_SingleId'
    InsertDataRequest:
      type: object
      description: 空間IDの配列を指定して値を挿入する
      required:
      - value
      - spatial_ids
      properties:
        value: {}
        spatial_ids:
          type: array
          items:
            $ref: '#/components/schemas/SpatialId'
        zoom_level_policy:
          $ref: '#/components/schemas/ZoomLevelPolicy'
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: root
        password:
          type: string
          example: password
    LoginResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
    MappingEntry:
      type: object
      description: 対応表エントリ
      required:
      - from
      - to
      properties:
        from:
          description: 変換前の値
        to:
          description: 変換後の値
    MergePolicyKind:
      type: string
      description: 同一空間に複数の値が集まったときの集約規則。
      enum:
      - overwrite
      - keepExisting
      - sum
      - max
      - min
      - average
      - difference
    OutputFormat:
      type: string
      enum:
      - singleId
      - rangeId
      - flexId
    PrivilegeInfoResponse:
      type: object
      required:
      - db_name
      - role
      properties:
        db_name:
          type: string
          example: example_database
        role:
          $ref: '#/components/schemas/UserRole'
    QueryNode:
      oneOf:
      - type: object
        description: 演算の起点。読み出し対象のテーブルを指定する。
        required:
        - database
        - table
        - type
        properties:
          database:
            type: string
            example: example_database
          table:
            type: string
            example: example_table
          type:
            type: string
            enum:
            - source
      - allOf:
        - $ref: '#/components/schemas/FilterCondition'
        - type: object
          required:
          - input
          properties:
            input:
              $ref: '#/components/schemas/QueryNode'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - filterValues
      - type: object
        description: X方向へ平行移動する
        required:
        - input
        - z
        - index
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          index:
            type: integer
            format: int32
            example: 1
          type:
            type: string
            enum:
            - shiftX
      - type: object
        description: Y方向へ平行移動する
        required:
        - input
        - z
        - index
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          index:
            type: integer
            format: int32
            example: 1
          type:
            type: string
            enum:
            - shiftY
      - type: object
        description: F(高度)方向へ平行移動する
        required:
        - input
        - z
        - index
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          index:
            type: integer
            format: int32
            example: 1
          type:
            type: string
            enum:
            - shiftF
      - type: object
        description: 指定された値までズームレベルを落とし、`policy` で集約する
        required:
        - input
        - z
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 24
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - zoomOut
      - type: object
        description: X方向の絶対座標範囲へ引き延ばす
        required:
        - input
        - z
        - start
        - end
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          start:
            type: integer
            format: int32
            example: 7300000
            minimum: 0
          end:
            type: integer
            format: int32
            example: 7300063
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - extrudeX
      - type: object
        description: Y方向の絶対座標範囲へ引き延ばす
        required:
        - input
        - z
        - start
        - end
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          start:
            type: integer
            format: int32
            example: 3276800
            minimum: 0
          end:
            type: integer
            format: int32
            example: 3276863
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - extrudeY
      - type: object
        description: F方向の絶対座標範囲へ引き延ばす
        required:
        - input
        - z
        - start
        - end
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          start:
            type: integer
            format: int32
            example: -5
          end:
            type: integer
            format: int32
            example: 5
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - extrudeF
      - type: object
        description: X方向へ、指定距離で0になるよう値を線形減衰させる
        required:
        - input
        - z
        - radius
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          radius:
            type: integer
            format: int32
            example: 3
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - falloffLinearX
      - type: object
        description: Y方向へ、指定距離で0になるよう値を線形減衰させる
        required:
        - input
        - z
        - radius
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          radius:
            type: integer
            format: int32
            example: 3
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - falloffLinearY
      - type: object
        description: F方向へ、指定距離で0になるよう値を線形減衰させる
        required:
        - input
        - z
        - radius
        - policy
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          z:
            type: integer
            format: int32
            example: 25
            minimum: 0
          radius:
            type: integer
            format: int32
            example: 3
            minimum: 0
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - falloffLinearF
      - type: object
        description: |-
          2つの部分式を `policy` で重ね合わせる。
          片側にしか値が無いセルは `default` を相手側の値とみなす。
        required:
        - left
        - right
        - default
        - policy
        - type
        properties:
          left:
            $ref: '#/components/schemas/QueryNode'
          right:
            $ref: '#/components/schemas/QueryNode'
          default: {}
          policy:
            $ref: '#/components/schemas/MergePolicyKind'
          type:
            type: string
            enum:
            - merge
      - type: object
        description: 値を対応表に基づいて変換する。対応表にない値は `default` になる。
        required:
        - input
        - output_type
        - mapping
        - default
        - type
        properties:
          input:
            $ref: '#/components/schemas/QueryNode'
          output_type:
            $ref: '#/components/schemas/TableDataType'
            description: この MapValues が出力する型。対応表の `to` や `default` はこの型として解釈される。
          mapping:
            type: array
            items:
              $ref: '#/components/schemas/MappingEntry'
            description: 変換前後の対応表。`from` の重複は 400 で拒否される。
          default:
            description: 対応表に存在しない値に使う既定値
          type:
            type: string
            enum:
            - mapValues
    RangeId:
      type: object
      description: |-
        区間表現の時空間IDを表す型。

        時間を指定する場合は `i` と `t` を必ず両方指定すること。
        両方省略した場合は「全時間」を表す。
      required:
      - z
      - f
      - x
      - y
      properties:
        z:
          type: integer
          format: int32
          description: ズームレベル。
          example: 20
          maximum: 30
          minimum: 0
        f:
          type: array
          items:
            type: integer
            format: int32
          description: 高さ方向の範囲 `[min, max]`（両端を含む）。
          example:
          - 0
          - 0
        x:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: 経度方向の範囲 `[min, max]`（両端を含む）。
          example:
          - 931388
          - 931390
        y:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: 緯度方向の範囲 `[min, max]`（両端を含む）。
          example:
          - 412900
          - 412907
        i:
          type:
          - integer
          - 'null'
          format: int64
          description: '時間間隔（単位: 秒）。1970-01-01T00:00:00Z を起点とする。任意の値は指定できず、 次の暦の単位のいずれかのみ指定できる: `1`、`60`、`3600`、`86400`、`34359738368`（システムの全時間）。'
          example: 3600
          maximum: 34359738368
          minimum: 1
        t:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
            minimum: 0
          description: 時間インデックスの区間表現。
          example:
          - 0
          - 5
    RemoveDataRequest:
      type: object
      description: 空間IDの配列を指定して値を削除する
      required:
      - spatial_ids
      properties:
        spatial_ids:
          type: array
          items:
            $ref: '#/components/schemas/SpatialId'
        zoom_level_policy:
          $ref: '#/components/schemas/ZoomLevelPolicy'
    SingleId:
      type: object
      description: |-
        通常の時空間IDを表す型。

        時間を指定する場合は `i` と `t` を必ず両方指定すること。
        両方省略した場合は「全時間」を表す。
      required:
      - z
      - f
      - x
      - y
      properties:
        z:
          type: integer
          format: int32
          description: ズームレベル。
          example: 20
          maximum: 30
          minimum: 0
        f:
          type: integer
          format: int32
          description: 高さ方向のインデックス。
          example: 0
        x:
          type: integer
          format: int32
          description: 経度方向のインデックス。
          example: 931386
          minimum: 0
        y:
          type: integer
          format: int32
          description: 緯度方向のインデックス。
          example: 412905
          minimum: 0
        i:
          type:
          - integer
          - 'null'
          format: int64
          description: '時間間隔（単位: 秒）。1970-01-01T00:00:00Z を起点とする。任意の値は指定できず、 次の暦の単位のいずれかのみ指定できる: `1`、`60`、`3600`、`86400`、`34359738368`（システムの全時間）。'
          example: 3600
          maximum: 34359738368
          minimum: 1
        t:
          type:
          - integer
          - 'null'
          format: int64
          description: 時間インデックス。
          example: 1
          minimum: 0
    SpatialId:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/SingleId'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - singleId
      - allOf:
        - $ref: '#/components/schemas/RangeId'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - rangeId
      - allOf:
        - $ref: '#/components/schemas/FlexId'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - flexId
    SystemInfoResponse:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: サーバーのステータス（通常は "ok"）
        version:
          type: string
          description: サーバーのバージョン
    TableConstraints:
      oneOf:
      - type: object
        description: '`Text` 型に対する制約。'
        required:
        - type
        properties:
          min_length:
            type:
            - integer
            - 'null'
            description: 最小文字数
            minimum: 0
          max_length:
            type:
            - integer
            - 'null'
            description: 最大文字数
            minimum: 0
          type:
            type: string
            enum:
            - Text
        example:
          max_length: 100
          min_length: 1
          type: Text
      - type: object
        description: '`Int` 型に対する制約。'
        required:
        - type
        properties:
          min:
            type:
            - integer
            - 'null'
            format: int64
            description: 最小値（境界値を含む）
          max:
            type:
            - integer
            - 'null'
            format: int64
            description: 最大値（境界値を含む）
          type:
            type: string
            enum:
            - Int
        example:
          max: 100
          min: 0
          type: Int
      - type: object
        description: '`Float` 型に対する制約。'
        required:
        - type
        properties:
          min:
            type:
            - number
            - 'null'
            format: double
            description: 最小値（境界値を含む）
          max:
            type:
            - number
            - 'null'
            format: double
            description: 最大値（境界値を含む）
          type:
            type: string
            enum:
            - Float
        example:
          max: 100.0
          min: 0.0
          type: Float
      - type: object
        description: '`Enum` 型に対する制約。'
        required:
        - choices
        - type
        properties:
          choices:
            type: array
            items:
              type: string
            description: 許容される文字列の配列
          mapping:
            type: object
            description: '内部用: 文字列から整数IDへのマッピング'
            additionalProperties:
              type: integer
              format: int32
              minimum: 0
            propertyNames:
              type: string
          next_id:
            type: integer
            format: int32
            description: '内部用: 次に割り当てる整数ID'
            minimum: 0
          type:
            type: string
            enum:
            - Enum
        example:
          choices:
          - red
          - blue
          - green
          type: Enum
      description: |-
        テーブルの値に対する制約。

        `type` フィールドで制約の種類を指定する。指定できる種類は対象のデータ型に依存する。
        - `Text`: 文字列の長さ制約（`min_length`, `max_length`）
        - `Int` / `Float`: 数値の範囲制約（`min`, `max`）
        - `Enum`: 許容される選択肢の制約（`choices`）

        `Presence` および `Boolean` には制約を指定できない。
    TableDataType:
      type: string
      description: Table内の時空間IDに付与する値の型。
      enum:
      - Text
      - Int
      - Float
      - Boolean
      - Enum
      - Presence
    TableInfoResponse:
      type: object
      description: 単一テーブルの詳細情報。保持する空間ID(FlexId)の総数 `count` を必ず含む。
      required:
      - name
      - data_type
      - max_zoom_level
      - count
      properties:
        name:
          type: string
          example: example_table
        data_type:
          $ref: '#/components/schemas/TableDataType'
        max_zoom_level:
          type: integer
          format: int32
          example: 25
          minimum: 0
        count:
          type: integer
          format: int64
          example: 100
          minimum: 0
        constraints:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TableConstraints'
        description:
          type:
          - string
          - 'null'
          example: テーブルの説明文です
    TableListResponse:
      type: array
      items:
        $ref: '#/components/schemas/TableSummary'
    TableSummary:
      type: object
      description: テーブルの基本情報。一覧で返す軽量ビューで、件数は含まない。
      required:
      - name
      - data_type
      - max_zoom_level
      properties:
        name:
          type: string
          example: example_table
        data_type:
          $ref: '#/components/schemas/TableDataType'
        max_zoom_level:
          type: integer
          format: int32
          example: 25
          minimum: 0
        constraints:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TableConstraints'
        description:
          type:
          - string
          - 'null'
          example: テーブルの説明文です
    UpdateAdminRequest:
      type: object
      required:
      - is_global_admin
      properties:
        is_global_admin:
          type: boolean
          example: false
    UpdateDatabaseRequest:
      type: object
      properties:
        new_name:
          type:
          - string
          - 'null'
          example: example_database_renamed
        description:
          type:
          - string
          - 'null'
          example: 更新されたデータベースの説明です
    UpdatePasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          example: newsecret123
    UpdatePrivilegeRequest:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateTableConstraints:
      oneOf:
      - type: object
        required:
        - type
        properties:
          min_length:
            type:
            - integer
            - 'null'
            minimum: 0
          max_length:
            type:
            - integer
            - 'null'
            minimum: 0
          type:
            type: string
            enum:
            - Text
        example:
          max_length: 100
          min_length: 1
          type: Text
      - type: object
        required:
        - type
        properties:
          min:
            type:
            - integer
            - 'null'
            format: int64
          max:
            type:
            - integer
            - 'null'
            format: int64
          type:
            type: string
            enum:
            - Int
        example:
          max: 100
          min: 0
          type: Int
      - type: object
        required:
        - type
        properties:
          min:
            type:
            - number
            - 'null'
            format: double
          max:
            type:
            - number
            - 'null'
            format: double
          type:
            type: string
            enum:
            - Float
        example:
          max: 100.0
          min: 0.0
          type: Float
      - type: object
        required:
        - type
        properties:
          choices:
            type:
            - array
            - 'null'
            items:
              type: string
          add_choices:
            type:
            - array
            - 'null'
            items:
              type: string
          remove_choices:
            type:
            - array
            - 'null'
            items:
              type: string
          type:
            type: string
            enum:
            - Enum
        example:
          add_choices:
          - yellow
          remove_choices:
          - red
          type: Enum
    UpdateTableRequest:
      type: object
      description: テーブルの名前変更または制約を更新する
      properties:
        name:
          type:
          - string
          - 'null'
          example: example_table_renamed
        constraints:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateTableConstraints'
            description: 更新後の値に対する制約。指定しない場合は制約を削除する。
        validate_existing_data:
          type: boolean
          description: |-
            既存データが新しい制約を満たしているか検証するかどうか。

            - `true` (デフォルト): 既存データが新しい制約に違反している場合、更新を却下してエラー (400) を返します。
            - `false`: 既存データの走査をスキップして即座に変更を適用します。高速に変更できますが、制約に適合しない不整合なデータが残るリスクがあります。
          default: true
          example: true
        description:
          type:
          - string
          - 'null'
          example: 更新されたテーブルの説明文です
    UserInfoResponse:
      type: object
      required:
      - username
      - is_global_admin
      properties:
        username:
          type: string
          example: example_user
        is_global_admin:
          type: boolean
          example: false
    UserRole:
      type: string
      enum:
      - Read
      - Write
      - Manage
    ZoomLevelPolicy:
      type: string
      description: テーブルの max_zoom_level よりも大きなズームレベル値の空間IDが入力された場合の処理方針
      enum:
      - Error
      - Ignore
      - Normalize
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
