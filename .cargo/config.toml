[unstable]
codegen-backend = true

[build]
rustflags = ["-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Zthreads=0", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-apple-darwin]
rustflags = ["-Zthreads=0", "-C", "split-debuginfo=unpacked"]

[target.x86_64-apple-darwin]
rustflags = ["-Zthreads=0", "-C", "split-debuginfo=unpacked"]

[profile.dev]
codegen-backend = "cranelift"
debug = 0

[profile.dev.package."*"]
opt-level = 1
