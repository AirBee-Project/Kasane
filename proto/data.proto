syntax = "proto3";

package kasane;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "common.proto";

// 検索結果として返す空間IDの表現形式。
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_SINGLE_ID = 1;
  OUTPUT_FORMAT_RANGE_ID = 2;
  OUTPUT_FORMAT_FLEX_ID = 3;
}

// `dictionary[value_ref]` が対応する値。同じ値を持つ空間IDをまとめる。
message DataGroup {
  uint64 value_ref = 1;
  repeated SpatialId spatial_ids = 2;
}

// `Search`/`QueryService.Execute` の共通レスポンス形状。
// `spatial_ids` の中身がどの `oneof kind` になるかは、要求した `OutputFormat` で揃う。
message SearchDataResponse {
  repeated google.protobuf.Value dictionary = 1;
  repeated DataGroup data = 2;
}

// **必要な権限**: `table` / `read`
message SearchDataRequest {
  string db_name = 1;
  string table_name = 2;
  repeated SpatialId spatial_ids = 3;
  ZoomLevelPolicy zoom_level_policy = 4;
  OutputFormat format = 5;
  optional uint64 limit = 6;
}

// **必要な権限**: `table` / `write`
message InsertDataRequest {
  string db_name = 1;
  string table_name = 2;
  google.protobuf.Value value = 3;
  repeated SpatialId spatial_ids = 4;
  ZoomLevelPolicy zoom_level_policy = 5;
}

// **必要な権限**: `table` / `write`
message UpsertDataRequest {
  string db_name = 1;
  string table_name = 2;
  google.protobuf.Value value = 3;
  repeated SpatialId spatial_ids = 4;
  ZoomLevelPolicy zoom_level_policy = 5;
}

// **必要な権限**: `table` / `write`
message RemoveDataRequest {
  string db_name = 1;
  string table_name = 2;
  repeated SpatialId spatial_ids = 3;
  ZoomLevelPolicy zoom_level_policy = 4;
}

service DataService {
  rpc Search(SearchDataRequest) returns (SearchDataResponse);
  rpc Insert(InsertDataRequest) returns (google.protobuf.Empty);
  rpc Upsert(UpsertDataRequest) returns (google.protobuf.Empty);
  rpc Remove(RemoveDataRequest) returns (google.protobuf.Empty);
}
