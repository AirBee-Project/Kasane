syntax = "proto3";

package kasane;

import "common.proto";

service DataService {
  // 指定された空間IDに合致するデータを検索し、値辞書形式でストリーミング取得する。
  rpc Search(SearchDataRequest) returns (stream SearchDataResponse);
  // テーブルにデータを挿入する（既存データとの重複がある場合はエラー）。
  rpc Insert(InsertDataRequest) returns (InsertDataResponse);
  // テーブルにデータを更新または挿入する。
  rpc Upsert(UpsertDataRequest) returns (UpsertDataResponse);
  // テーブルから指定された空間IDのデータを削除する。
  rpc Remove(RemoveDataRequest) returns (RemoveDataResponse);
}

// 検索結果として返す空間IDの表現形式。
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_SINGLE_ID = 1;
  OUTPUT_FORMAT_RANGE_ID = 2;
  OUTPUT_FORMAT_FLEX_ID = 3;
}

// dict_ref はストリーム全体で共有する辞書（SearchDataResponse.dictionary を受信順に
// 連結したもの）への添字。辞書が上限に達した後の新規値は inline_value になる。
message DataGroup {
  oneof value {
    uint64 dict_ref = 1;
    TypedValue inline_value = 2;
  }
  repeated SpatialId spatial_ids = 3;
}

// dictionary はメッセージをまたいで累積する辞書への追加分のみを運ぶ。
message SearchDataResponse {
  repeated TypedValue dictionary = 1;
  repeated DataGroup data = 2;
}

// **必要な権限**: `table` / `read`
message SearchDataRequest {
  string db_name = 1;
  string table_name = 2;
  repeated SpatialId spatial_ids = 3;
  ZoomLevelPolicy zoom_level_policy = 4;
  OutputFormat format = 5;
}

// **必要な権限**: `table` / `write`
message InsertDataRequest {
  string db_name = 1;
  string table_name = 2;
  TypedValue value = 3;
  repeated SpatialId spatial_ids = 4;
  ZoomLevelPolicy zoom_level_policy = 5;
}

message InsertDataResponse {}

// **必要な権限**: `table` / `write`
message UpsertDataRequest {
  string db_name = 1;
  string table_name = 2;
  TypedValue value = 3;
  repeated SpatialId spatial_ids = 4;
  ZoomLevelPolicy zoom_level_policy = 5;
}

message UpsertDataResponse {}

// **必要な権限**: `table` / `write`
message RemoveDataRequest {
  string db_name = 1;
  string table_name = 2;
  repeated SpatialId spatial_ids = 3;
  ZoomLevelPolicy zoom_level_policy = 4;
}

message RemoveDataResponse {}
