syntax = "proto3";

package kasane;

// 認証不要（このサービスだけ AuthInterceptor の対象外）。
service AuthService {
  // 利用者名とパスワードで認証し、JWT トークンを発行する。
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}
