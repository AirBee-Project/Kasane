syntax = "proto3";

package kasane;

service DatabaseService {
  // データベースを新規作成する。
  rpc Create(CreateDatabaseRequest) returns (DatabaseInfo);
  // データベースの詳細情報を取得する。
  rpc Get(GetDatabaseRequest) returns (DatabaseInfo);
  // アクセス可能なデータベースの一覧を取得する。
  rpc List(ListDatabasesRequest) returns (ListDatabasesResponse);
  // データベースの名前または説明文を更新する。
  rpc Update(UpdateDatabaseRequest) returns (UpdateDatabaseResponse);
  // データベースと配下のテーブルを削除する。
  rpc Delete(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);
  // データベースを丸ごと複製する。
  rpc Copy(CopyDatabaseRequest) returns (DatabaseInfo);
}

message DatabaseInfo {
  string name = 1;
  optional string description = 2;
}

// **必要な権限**: `global` / `manage`
message CreateDatabaseRequest {
  string name = 1;
  optional string description = 2;
}

// **必要な権限**: `database` / `read`（配下テーブルの権限でも可）
message GetDatabaseRequest {
  string db_name = 1;
}

// **必要な権限**: なし（認証のみ・結果は権限で絞られる）
message ListDatabasesRequest {}

message ListDatabasesResponse {
  repeated DatabaseInfo databases = 1;
}

// **必要な権限**: `database` / `manage`
message UpdateDatabaseRequest {
  string db_name = 1;
  optional string new_name = 2;
  oneof description_update {
    bool clear_description = 3;
    string set_description = 4;
  }
}

message UpdateDatabaseResponse {}

// **必要な権限**: `global` / `manage`
message DeleteDatabaseRequest {
  string db_name = 1;
}

message DeleteDatabaseResponse {}

// **必要な権限**: `global` / `manage`
message CopyDatabaseRequest {
  string db_name = 1;
  string copy_name = 2;
}
