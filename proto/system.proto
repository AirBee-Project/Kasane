syntax = "proto3";

package kasane;

import "google/protobuf/empty.proto";

// サーバーのステータスとバージョン情報。
message SystemInfo {
  string status = 1;
  string version = 2;
}

// 認証必須（追加の権限は要求しない）。ヘルスチェックは標準の
// `grpc.health.v1.Health` サービス（`tonic-health`）が別途担い、
// このサービスには含めない。
service SystemService {
  rpc GetInfo(google.protobuf.Empty) returns (SystemInfo);
}
