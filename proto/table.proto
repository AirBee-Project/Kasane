syntax = "proto3";

package kasane;

import "common.proto";
import "google/protobuf/empty.proto";

service TableService {
  // テーブルを新規作成する。
  rpc Create(CreateTableRequest) returns (TableInfo);
  // テーブルの詳細情報を取得する。
  rpc Get(GetTableRequest) returns (TableInfo);
  // データベース内のテーブル一覧を取得する。
  rpc List(ListTablesRequest) returns (ListTablesResponse);
  // テーブルの名前、制約、説明文、または時間ロック設定を更新し、更新後の情報を返す。
  rpc Update(UpdateTableRequest) returns (TableInfo);
  // テーブルを削除する。
  rpc Delete(DeleteTableRequest) returns (google.protobuf.Empty);
}

message TableInfo {
  string name = 1;
  TableDataType data_type = 2;
  uint32 max_zoom_level = 3;
  // 保持する空間ID(FlexId)の総数。
  uint64 count = 4;
  optional TableConstraints constraints = 5;
  optional string description = 6;
  bool is_temporal = 7;
}

// **必要な権限**: `database` / `manage`
message CreateTableRequest {
  string db_name = 1;
  string name = 2;
  TableDataType data_type = 3;
  uint32 max_zoom_level = 4;
  // 指定しない場合は制約なし。
  optional TableConstraints constraints = 5;
  optional string description = 6;
  // テーブルが時間IDを扱うかどうか。
  bool is_temporal = 8;
}

// **必要な権限**: `table` / `read`（またはデータベーススコープの `read`）
message GetTableRequest {
  string db_name = 1;
  string table_name = 2;
}

// **必要な権限**: `database` / `read`
message ListTablesRequest {
  string db_name = 1;
}

message ListTablesResponse {
  repeated TableInfo tables = 1;
}

// **必要な権限**: `table` / `manage`
message UpdateTableRequest {
  string db_name = 1;
  string table_name = 2;
  optional string new_name = 3;
  // 時間ロックの解除。`true` のみ指定可能。
  optional bool is_temporal = 4;

  oneof description_update {
    bool clear_description = 5;
    string set_description = 6;
  }

  oneof constraints_update {
    bool clear_constraints = 7;
    // 制約を丸ごと置き換える。
    TableConstraints set_constraints = 8;
  }
}

// **必要な権限**: `table` / `manage`
message DeleteTableRequest {
  string db_name = 1;
  string table_name = 2;
}
