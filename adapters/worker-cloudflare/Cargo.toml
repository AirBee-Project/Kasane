[package]
name = "kasane-worker-cloudflare"
version = "0.1.0"
edition = "2024"
description = "Cloudflare Worker adapter for Kasane Smart Reverse Proxy"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
kasane-proxy-core = { path = "../../crates/kasane-proxy-core" }
http = "1.2"
bytes = "1.10"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
