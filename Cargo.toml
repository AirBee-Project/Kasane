[package]
name = "kasane"
version = "0.5.5"
edition = "2024"
default-run = "kasane"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15"
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", features = ["persist", "temporal_id", "unstable"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.5", features = [
    "axum_extras",
    "preserve_order",
    "preserve_path_order",
] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = { version = "0.22.1", optional = true }
tikv-client = { version = "0.4", optional = true }
crc32fast = { version = "1", optional = true }
rayon = "1.12"
rustc-hash = "2.1.2"

axum-tracing-opentelemetry = { version = "0.38.0", features = ["tracing_level_info"], optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
], optional = true }
opentelemetry-otlp = { version = "0.32.0" , default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
mimalloc = { version = "0.1", optional = true }
thiserror = "2.0.20"

[features]
default = ["backend-lmdb"]
backend-lmdb = ["dep:heed"]
backend-tikv = ["dep:tikv-client", "dep:crc32fast"]

# 互換性テスト用
gen-fixtures = []

production = [
    "axum-tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "opentelemetry-appender-tracing",
    "tracing-opentelemetry",
    "percent-encoding",
    "mimalloc",
]

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
serde_yaml = "0.9"
tower = { version = "0.5.3", features = ["util"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
