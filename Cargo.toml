[package]
name = "kasane"
version = "0.6.6"
edition = "2024"
default-run = "kasane"

[dependencies]
dotenvy = "0.15"
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", features = ["persist", "temporal_id", "unstable"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = { version = "0.22.1", optional = true }
tikv-client = { version = "0.4", optional = true }
crc32fast = { version = "1", optional = true }
rayon = "1.12"
rustc-hash = "2.1.2"
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
], optional = true }
opentelemetry-otlp = { version = "0.32.0" , default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
mimalloc = { version = "0.1", optional = true }
thiserror = "2.0.20"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
tonic-web = "0.14.6"
tonic-reflection = "0.14.6"
tonic-health = "0.14.6"
tonic-types = "0.14.6"
tonic-prost = "0.14.6"
http = "1.5.0"

[features]
default = ["backend-lmdb"]
backend-lmdb = ["dep:heed"]
backend-tikv = ["dep:tikv-client", "dep:crc32fast"]

# 互換性テスト用
gen-fixtures = []

production = [
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "opentelemetry-appender-tracing",
    "tracing-opentelemetry",
    "mimalloc",
]

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "query_workflow_risk_diffusion"
path = "benches/query/workflow/risk_diffusion.rs"
harness = false

[[bench]]
name = "query_unary_falloff"
path = "benches/query/unary/falloff.rs"
harness = false

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[build-dependencies]
tonic-prost-build = "0.14.6"
