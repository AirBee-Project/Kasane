[package]
name = "kasane"
version = "0.3.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", features = ["persist"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.5", features = ["axum_extras","preserve_order"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7.0", features = ["trace"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = "0.22.1"
rayon = "1.12"
tokio-stream = { version = "0.1.18", features = ["sync"] }
rustc-hash = "2.1.2"
axum-tracing-opentelemetry = { version = "0.38.0", features = ["tracing_level_info"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.33.0"
percent-encoding = "2.3.2"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
serde_yaml = "0.9"
reqwest = "0.13.4"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook","run-cargo-test", "run-cargo-clippy","run-cargo-fmt"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
