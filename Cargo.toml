[package]
name = "kasane"
version = "0.0.2"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
uuid = { version="1.18.1", features = ["v4","serde"]}
tokio = { version = "1.48.0", features = ["full"], optional = true  }
num_cpus = { version = "1.17.0", optional = true }
thiserror = "2.0.17"
redb = { version = "3.1.0", optional = true }
ts-rs = { version = "11.1.0", optional = true }
kasane-logic = { path = "../kasane-logic"}
once_cell = "1.19"
bincode = { version = "2.0", optional = true }
bcrypt = { version = "0.17", optional = true }
regex = { version = "1.11", optional = true }



[lib]
crate-type = ["cdylib"]


[features]
# ストレージ設定
wasm = []            #Wasm上で動作
on-memory = []       #OnMemoryDBとして動作
file = ["dep:redb","dep:bincode","dep:bcrypt","dep:regex"]

# 型情報の書き出し
serde = ["dep:serde"]
ts-rs = ["dep:ts-rs"]
