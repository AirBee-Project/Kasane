[package]
name = "kasane"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", branch = "main"}
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.0", features = ["axum_extras","preserve_order"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
tower = { version = "0.5.3", features = ["util"] }
redb = "4.1.0"
uuid = { version = "1.23.1", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6.1", features = ["trace"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
serde_yaml = "0.9"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook","run-cargo-test", "run-cargo-clippy","run-cargo-fmt"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 'z'
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"