[package]
name = "kasane"
version = "0.0.2"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version="1.18.1", features = ["v4","serde"]}
tokio = { version = "1.48.0", features = ["full"] }
num_cpus = { version = "1.17.0"}
thiserror = "2.0.17"
axum = { version = "0.8.6", features = ["ws", "tokio", "http1", "http2"] }
toml_edit = "0.22.25"
toml = "0.9.8"
tower = "0.5.2"
redb = "3.1.0"
bcrypt = "0.17.1"
regex = "1.12.2"
bincode = {version="2",features=["derive","serde"]}
ts-rs = "11.1.0"
kasane-logic={path="../kasane-logic"}



[lib]
crate-type = ["cdylib"]