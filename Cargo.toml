[package]
name = "kasane"
version = "0.5.1"
edition = "2024"
default-run = "kasane"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", features = ["persist", "temporal_id"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.5", features = [
    "axum_extras",
    "preserve_order",
    "preserve_path_order",
] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = { version = "0.22.1", optional = true }
tikv-client = { version = "0.4", optional = true }
# TiKV に保存するシャード値の完全性検証（src/repositories/tikv/kv.rs）。
crc32fast = { version = "1", optional = true }
rayon = "1.12"
rustc-hash = "2.1.2"

axum-tracing-opentelemetry = { version = "0.38.0", features = ["tracing_level_info"], optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    # ログのバッチ送出は既定だと OS スレッドで動き、OTLP(HTTP) の reqwest が要求する
    # Tokio のリアクタが無くて panic する（"there is no reactor running"）。
    # トレースと同じく Tokio 束縛の処理系を使う。
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
], optional = true }
opentelemetry-otlp = { version = "0.32.0" , default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-client", "reqwest-rustls"], optional = true }
# tracing のイベントを OTLP ログへ橋渡しする。スパン文脈を自動で載せるので、
# New Relic 側でトレースとログが相互に辿れる。
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
mimalloc = { version = "0.1", optional = true }

[features]
default = ["backend-lmdb"]
backend-lmdb = ["dep:heed"]
backend-tikv = ["dep:tikv-client", "dep:crc32fast"]

# DB互換性フィクスチャ（tests/gen_db_compat_fixture.rs）を手動生成するときだけ立てる。
# 通常のテスト実行（CI 含む）では立てないので、生成器は自動では走らない。
gen-fixtures = []

production = [
    "axum-tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "opentelemetry-appender-tracing",
    "tracing-opentelemetry",
    "percent-encoding",
    "mimalloc",
]

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
serde_yaml = "0.9"
tower = { version = "0.5.3", features = ["util"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic は巻き戻す（`abort` にしない）。
#
# 依存ライブラリの panic 1 つでプロセスが落ちるのは、データベースとして割に合わない。
# 実際 tikv-client 0.3 は PD の応答に対して `unwrap()` を置いており、PD が一時的に
# リーダ不在を返すと `pd/cluster.rs` の `resp.leader.as_ref().unwrap()` で落ちる。
# これはリクエスト処理中の経路なので、`abort` だとサーバごと巻き添えになる。
#
# 巻き戻しなら tokio がタスク単位で panic を捕まえるので、被害はその 1 リクエストで済む。
# 代償はバイナリサイズと僅かな実行コストだが、可用性と引き換えにする理由はない。
#
# なお `tikv_client::CheckLevel::Warn` を使っているのも同じ動機
# （`repositories::tikv` のトランザクションの開き方を参照）。あちらは踏まないように
# したが、依存の内側の `unwrap()` はこちらでは塞げない。
