[package]
name = "kasane"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
kasane-logic = { path = "../kasane-logic", features = ["serde","openapi"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.0", features = ["axum_extras"] }
tower = { version = "0.5.3" }
redb = "4.0.0"
