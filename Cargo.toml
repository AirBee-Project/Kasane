[package]
name = "kasane"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["redb"]
redb = ["dep:redb"]
tikv = ["dep:tikv-client"]
memory = []

[dependencies]
kasane-logic = { path = "../kasane-logic" }
thiserror = "2.0.18"

# --- Native Dependencies ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { version = "3.1.0", optional = true }
tikv-client = { version = "0.3.0", optional = true }
