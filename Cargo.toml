[package]
name = "kasane"
version = "0.7.0"
edition = "2024"
default-run = "kasane"

[workspace]
members = [".", "wasm"]

[dependencies]
dotenvy = { version = "0.15", optional = true }
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", features = ["persist", "temporal_id", "unstable"] }
tokio = { version = "1.52", features = ["rt", "macros", "sync"] }
tokio-stream = { version = "0.1", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = { version = "0.22.1", optional = true }
tikv-client = { version = "0.4", optional = true }
crc32fast = { version = "1", optional = true }
rayon = "1.12"
rustc-hash = "2.1.2"
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
], optional = true }
opentelemetry-otlp = { version = "0.32.0" , default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
mimalloc = { version = "0.1", optional = true }
thiserror = "2.0.20"
tower-http = { version = "0.7.0", features = ["cors", "trace"], optional = true }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"], optional = true }
prost = { version = "0.14.4", optional = true }
tonic-web = { version = "0.14.6", optional = true }
tonic-reflection = { version = "0.14.6", optional = true }
tonic-health = { version = "0.14.6", optional = true }
tonic-types = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
http = { version = "1.5.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.23.4", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["server", "backend-lmdb"]
# proto のメッセージ型と各サービスの実装。通信路を持たないので Wasm でも使える。
grpc = [
    "dep:tokio-stream",
    "dep:tonic",
    "dep:prost",
    "dep:tonic-types",
    "dep:tonic-prost",
]
# gRPC サーバーとして待ち受けるための一式。
server = [
    "grpc",
    "dep:dotenvy",
    "dep:tower-http",
    "dep:tonic-web",
    "dep:tonic-reflection",
    "dep:tonic-health",
    "dep:http",
    "tonic/transport",
    "tonic/router",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/signal",
    "tokio/time",
]
backend-lmdb = ["dep:heed", "tokio/time"]
backend-tikv = ["dep:tikv-client", "dep:crc32fast", "tokio/time"]
backend-memory = []

# 互換性テスト用
gen-fixtures = []

production = [
    "server",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "opentelemetry-appender-tracing",
    "tracing-opentelemetry",
    "mimalloc",
]

[[bin]]
name = "kasane"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "query_workflow_risk_diffusion"
path = "benches/query/workflow/risk_diffusion.rs"
harness = false

[[bench]]
name = "query_unary_falloff"
path = "benches/query/unary/falloff.rs"
harness = false

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[build-dependencies]
tonic-prost-build = "0.14.6"
