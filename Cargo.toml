[package]
name = "kasane"
version = "0.7.0"
edition = "2024"
default-run = "kasane"

[dependencies]
dotenvy = "0.15"
spatial-id = { path = "../Kasane-Logic", features = ["unstable"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v7", "fast-rng", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
heed = "0.22.1"
rayon = "1.12"
rustc-hash = "2.1.2"
mimalloc = { version = "0.1", optional = true }
thiserror = "2.0.20"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tonic = "0.14.6"
prost = "0.14.4"
tonic-web = "0.14.6"
tonic-reflection = "0.14.6"
tonic-health = "0.14.6"
tonic-types = "0.14.6"
tonic-prost = "0.14.6"
http = "1.5.0"

[features]
production = ["dep:mimalloc"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[build-dependencies]
tonic-prost-build = "0.14.6"
